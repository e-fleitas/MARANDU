<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>M.A.R.A.N.D.U. - Iniciar sesión</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center">

    <div class="w-full max-w-sm">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-emerald-400">M.A.R.A.N.D.U. HIPS</h1>
            <p class="text-sm text-slate-400 mt-1">Módulo de Prevención &amp; Hardening del Sistema</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg">
            {% if error %}
            <div class="bg-rose-500/10 text-rose-400 border border-rose-500/30 text-sm px-3 py-2 rounded-md mb-4">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/login" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div>
                    <label class="block text-xs font-mono uppercase text-slate-400 mb-1" for="username">Usuario</label>
                    <input id="username" name="username" type="text" autocomplete="username" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-mono uppercase text-slate-400 mb-1"
                        for="password">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>

                <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-lg border border-emerald-500 shadow-md shadow-emerald-900/20 transition-all">
                    Ingresar
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-slate-500 mt-4 font-mono">Rocky Linux 9 (CIS)</p>
    </div>

</body>

</html>
