<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>M.A.R.A.N.D.U. - Hardening Dashboard</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-900 text-slate-100 font-sans">

    <div class="container mx-auto px-4 py-8">
        <header class="flex justify-between items-center border-b border-slate-700 pb-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-emerald-400">M.A.R.A.N.D.U. HIPS</h1>
                <p class="text-sm text-slate-400 mt-1">Módulo de Prevención &amp; Hardening del Sistema</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right">
                    <span
                        class="bg-slate-800 text-xs px-3 py-1.5 rounded-md border border-slate-700 uppercase font-mono text-slate-300">Rocky
                        Linux 9 (CIS)</span>
                    <p class="text-xs text-slate-500 mt-1 font-mono">{{ user }}</p>
                </div>
                <form method="post" action="/logout">
                    <button type="submit"
                        class="text-xs px-3 py-1.5 rounded-md border border-slate-700 text-slate-400 hover:text-rose-400 hover:border-rose-500/40 transition-all cursor-pointer">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </header>

        <!-- Grilla de Controles -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {% for control in controls %}
            <div
                class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col justify-between shadow-lg transition-all hover:border-slate-600">
                <div>
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-xs font-mono tracking-wider text-slate-400 uppercase">Control {{ loop.index
                            }}</span>

                        <!-- Badge Dinámico de Estado -->
                        {% if control.active %}
                        <span
                            class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                            Cumple (CIS)
                        </span>
                        {% else %}
                        <span
                            class="bg-rose-500/10 text-rose-400 border border-rose-500/30 text-xs font-semibold px-2.5 py-0.5 rounded-full animate-pulse">
                            Vulnerable
                        </span>
                        {% endif %}
                    </div>
                    <h3 class="text-lg font-medium text-slate-200">{{ control.description }}</h3>
                </div>

                <div class="mt-6 flex items-center justify-between gap-4 pt-4 border-t border-slate-700/50">
                    <span class="text-xs text-slate-400 font-mono">id: {{ control.id }}</span>

                    <!-- Botón de Acción Directa -->
                    <button onclick="applyHardening('{{ control.id }}', this)" class="px-4 py-2 text-xs font-semibold rounded-lg border transition-all cursor-pointer
                        {% if control.active %}
                            bg-slate-700 text-slate-400 border-slate-600 cursor-not-allowed opacity-60
                        {% else %}
                            bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-500 shadow-md shadow-emerald-900/20
                        {% endif %}" {% if control.active %} disabled {% endif %}>
                        {% if control.active %} Hardened {% else %} Aplicar Medida {% endif %}
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').content;

        async function applyHardening(controlId, buttonElement) {
            if (!confirm(`¿Estás seguro de que deseas aplicar el hardening para: ${controlId}?`)) return;

            const originalText = buttonElement.innerText;
            buttonElement.innerText = "Aplicando...";
            buttonElement.disabled = true;
            buttonElement.classList.add('opacity-50', 'cursor-wait');

            try {
                const response = await fetch(`/prevention/apply/${controlId}`, {
                    method: 'POST',
                    headers: { 'X-CSRF-Token': CSRF_TOKEN }
                });

                if (response.status === 401 || response.status === 303) {
                    // La sesión expiró: mandamos al login.
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();

                if (response.ok) {
                    alert(`Éxito: ${data.message}`);
                    window.location.reload();
                } else {
                    alert(`Error: ${data.detail}`);
                    buttonElement.innerText = originalText;
                    buttonElement.disabled = false;
                    buttonElement.classList.remove('opacity-50', 'cursor-wait');
                }
            } catch (error) {
                alert("Error de comunicación con el servidor HIPS.");
                buttonElement.innerText = originalText;
                buttonElement.disabled = false;
                buttonElement.classList.remove('opacity-50', 'cursor-wait');
            }
        }
    </script>
</body>

</html>
